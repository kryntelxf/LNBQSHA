<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNBQSHA Metaverse — Enter the World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #05050a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-overlay {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            z-index: 10;
        }
        .ui-overlay button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .ui-overlay button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.5);
        }
        .ui-overlay button.secondary {
            background: transparent;
            border: 1px solid #333;
        }
        .ui-overlay button.secondary:hover {
            border-color: #7c3aed;
        }
        .ui-overlay .info {
            display: flex;
            align-items: center;
            color: #999;
            font-size: 13px;
            padding: 0 16px;
        }
        .ui-overlay .info .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #05050a;
            z-index: 100;
            transition: opacity 1s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid #1a1a2e;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading p {
            margin-top: 24px;
            color: #666;
            font-size: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .ui-overlay { flex-wrap: wrap; justify-content: center; padding: 12px 16px; bottom: 20px; width: 90%; }
            .ui-overlay button { padding: 8px 16px; font-size: 12px; }
            .ui-overlay .info { display: none; }
        }
    </style>
</head>
<body>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>🌐 Entering LNBQSHA Metaverse...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="info">
            <span class="dot"></span>
            <span id="playerCount">0 players online</span>
        </div>
        <button onclick="alert('🎮 Coming soon: Full 3D movement!')">🚶 Explore</button>
        <button class="secondary" onclick="alert('👤 Avatar customization coming soon!')">👤 Avatar</button>
        <button class="secondary" onclick="alert('💬 Chat system coming soon!')">💬 Chat</button>
        <button onclick="window.location.href='../arcade/index.html'">🎮 Games</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        // LNBQSHA METAVERSE — 3D World
        // ============================================================

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        scene.fog = new THREE.FogExp2(0x05050a, 0.002);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // ============================================================
        // LIGHTS
        // ============================================================

        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x7c3aed, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xec4899, 0.5);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        const pointLight = new THREE.PointLight(0x7c3aed, 0.5, 50);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // ============================================================
        // GROUND
        // ============================================================

        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a12,
            roughness: 0.8,
            metalness: 0.2,
            transparent: true,
            opacity: 0.9
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============================================================
        // GRID
        // ============================================================

        const gridHelper = new THREE.GridHelper(80, 40, 0x1a1a2e, 0x1a1a2e);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // ============================================================
        // BUILDINGS / STRUCTURES
        // ============================================================

        function createBuilding(x, z, width, depth, height, color) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.6,
                metalness: 0.3,
                transparent: true,
                opacity: 0.9
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height/2 - 0.5, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // Hub center
        const hub = createBuilding(0, 0, 6, 6, 3, 0x1a1a2e);
        const hubGlow = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.3 })
        );
        hubGlow.position.set(0, 2, 0);
        scene.add(hubGlow);

        // Buildings around
        const buildingColors = [0x1a1a2e, 0x1a1a2e, 0x1a1a2e, 0x1a1a2e, 0x1a1a2e, 0x1a1a2e];
        const positions = [
            [-10, -8], [10, -8], [-10, 8], [10, 8],
            [-14, 0], [14, 0], [0, -14], [0, 14]
        ];
        positions.forEach((pos, i) => {
            const w = 2 + Math.random() * 3;
            const d = 2 + Math.random() * 3;
            const h = 1.5 + Math.random() * 2;
            createBuilding(pos[0], pos[1], w, d, h, buildingColors[i % buildingColors.length]);
        });

        // ============================================================
        // FLOATING PARTICLES / STARS
        // ============================================================

        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 1000;
        const positionsArray = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            positionsArray[i * 3] = (Math.random() - 0.5) * 80;
            positionsArray[i * 3 + 1] = Math.random() * 15 + 2;
            positionsArray[i * 3 + 2] = (Math.random() - 0.5) * 80;
            sizes[i] = Math.random() * 2 + 0.5;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positionsArray, 3));
        particlesGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particlesMat = new THREE.PointsMaterial({
            color: 0x7c3aed,
            size: 0.08,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // ============================================================
        // FLOATING ORBS
        // ============================================================

        const orbs = [];
        for (let i = 0; i < 8; i++) {
            const orb = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.7 })
            );
            const angle = (i / 8) * Math.PI * 2;
            const radius = 4 + Math.random() * 2;
            orb.position.set(Math.cos(angle) * radius, 1 + Math.random() * 2, Math.sin(angle) * radius);
            orb.userData = {
                angle: angle,
                radius: radius,
                speed: 0.5 + Math.random() * 0.5,
                heightOffset: Math.random() * 2
            };
            scene.add(orb);
            orbs.push(orb);
        }

        // ============================================================
        // TORUS / RING
        // ============================================================

        const ringGeo = new THREE.TorusGeometry(3, 0.05, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        ring.position.y = 1.5;
        scene.add(ring);

        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(4, 0.03, 16, 100),
            new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.2 })
        );
        ring2.rotation.x = Math.PI / 4;
        ring2.position.y = 2;
        scene.add(ring2);

        // ============================================================
        // PLAYER AVATARS (Placeholder)
        // ============================================================

        function createAvatar(x, z, color, label) {
            const group = new THREE.Group();

            // Body
            const body = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.3, 0.6, 4, 8),
                new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 })
            );
            body.position.y = 0.8;
            group.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.5 })
            );
            head.position.y = 1.3;
            group.add(head);

            // Name label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#a78bfa';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(2, 0.5, 1);
            sprite.position.y = 1.8;
            group.add(sprite);

            group.position.set(x, -0.5, z);
            scene.add(group);
            return group;
        }

        const avatarColors = [0x7c3aed, 0xec4899, 0x34d399, 0x60a5fa, 0xfbbf24];
        const avatarNames = ['Player_1', 'Player_2', 'Player_3', 'Player_4', 'Player_5'];
        const avatarPositions = [
            [-2, -2], [2, -2], [-2, 2], [2, 2], [0, -4]
        ];

        const avatars = [];
        avatarPositions.forEach((pos, i) => {
            const avatar = createAvatar(pos[0], pos[1], avatarColors[i % avatarColors.length], avatarNames[i % avatarNames.length]);
            avatars.push(avatar);
        });

        // ============================================================
        // ANIMATION
        // ============================================================

        let time = 0;
        let playerCount = Math.floor(Math.random() * 50) + 20;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotate hub glow
            hubGlow.material.opacity = 0.2 + Math.sin(time) * 0.1;

            // Animate orbs
            orbs.forEach((orb, i) => {
                const data = orb.userData;
                data.angle += 0.01 * data.speed;
                orb.position.x = Math.cos(data.angle) * data.radius;
                orb.position.z = Math.sin(data.angle) * data.radius;
                orb.position.y = 1 + Math.sin(time * data.speed + data.heightOffset) * 0.5;
            });

            // Rotate rings
            ring.rotation.z += 0.005;
            ring2.rotation.z -= 0.003;

            // Float particles
            particles.rotation.y += 0.0005;

            // Animate avatars (idle sway)
            avatars.forEach((avatar, i) => {
                avatar.position.y = -0.5 + Math.sin(time * 0.5 + i) * 0.05;
                avatar.rotation.y += 0.005;
            });

            // Camera orbit
            const radius = 20;
            const speed = 0.05;
            camera.position.x = Math.sin(time * speed) * radius;
            camera.position.z = Math.cos(time * speed) * radius;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ============================================================
        // RESIZE
        // ============================================================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        // SIMULATE PLAYER COUNT
        // ============================================================

        function updatePlayerCount() {
            playerCount += Math.floor(Math.random() * 6) - 2;
            playerCount = Math.max(10, Math.min(100, playerCount));
            document.getElementById('playerCount').textContent = `${playerCount} players online`;
            setTimeout(updatePlayerCount, 5000);
        }

        // ============================================================
        // START
        // ============================================================

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1500);

        updatePlayerCount();
        animate();
    </script>
</body>
  </html>

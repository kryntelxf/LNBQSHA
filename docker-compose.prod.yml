# LNBQSHA — Production Docker Compose
# Runs Nakama with PostgreSQL, Prometheus, Grafana

version: '3.8'

services:
  # ============================================================
  # POSTGRESQL — Database
  # ============================================================
  postgres:
    image: postgres:16.8-alpine
    container_name: lnbqsha-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lnbqsha-network

  # ============================================================
  # NAKAMA — Game Server
  # ============================================================
  nakama:
    image: heroiclabs/nakama:3.37.0
    container_name: lnbqsha-nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${DB_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama
        --name nakama
        --database.address postgres:${DB_PASSWORD:-localdb}@postgres:5432/nakama
        --logger.level ${LOG_LEVEL:-INFO}
        --session.token_expiry_sec ${TOKEN_EXPIRY:-7200}
        --socket.port 7350
        --console.port 7351
        --metrics.prometheus_port 9100
        --runtime.js_entrypoint "src/index.ts"
        --runtime.path "/nakama/data/modules"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/modules:/nakama/data/modules
    ports:
      - "7350:7350"
      - "7351:7351"
      - "9100:9100"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lnbqsha-network

  # ============================================================
  # PROMETHEUS — Metrics
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: lnbqsha-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - lnbqsha-network

  # ============================================================
  # GRAFANA — Dashboard
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: lnbqsha-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - lnbqsha-network
    depends_on:
      - prometheus

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

# ============================================================
# NETWORKS
# ============================================================
networks:
  lnbqsha-network:
    driver: bridge

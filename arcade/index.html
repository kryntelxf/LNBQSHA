<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNBQSHA Arcade — Play Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #05050a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .arcade-header {
            padding: 40px 20px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid #1a1a2e;
        }
        .arcade-header .logo { font-size: 24px; font-weight: 700; color: #7c3aed; }
        .arcade-header .logo span { color: #e0e0e0; }
        .arcade-header .search input {
            background: #0f0f1a;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            padding: 10px 16px;
            color: #e0e0e0;
            width: 250px;
            font-size: 14px;
        }
        .arcade-header .search input:focus { outline: none; border-color: #7c3aed; }
        .arcade-hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.1) 0%, transparent 70%);
        }
        .arcade-hero h1 { font-size: clamp(32px, 4vw, 56px); font-weight: 700; }
        .arcade-hero p { color: #666; font-size: 18px; max-width: 500px; margin: 8px auto; }
        .game-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }
        .game-card {
            background: #0f0f1a;
            border: 1px solid #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .game-card:hover { transform: translateY(-8px); border-color: #7c3aed; box-shadow: 0 8px 40px rgba(124, 58, 237, 0.15); }
        .game-card .thumb {
            height: 140px;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .game-card .info { padding: 16px 20px; }
        .game-card .info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .game-card .info p { color: #666; font-size: 13px; }
        .game-card .info .meta { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: #555; }
        .game-card .info .meta span { display: flex; align-items: center; gap: 4px; }
        .badge-playing {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #064e3b;
            color: #34d399;
        }
        .badge-hot {
            background: #7f1d1d;
            color: #f87171;
        }
        .badge-new {
            background: #1e3a5f;
            color: #60a5fa;
        }
        .badge-popular {
            background: #78350f;
            color: #fbbf24;
        }
        @media (max-width: 768px) {
            .arcade-header { flex-direction: column; align-items: stretch; }
            .arcade-header .search input { width: 100%; }
            .game-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .game-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="arcade-header">
        <div class="logo">LNB<span>QSHA</span> <span style="font-size:14px;color:#666;font-weight:400;">Arcade</span></div>
        <div class="search"><input type="text" placeholder="Search games..."></div>
    </header>

    <section class="arcade-hero">
        <h1>🎮 Play Games</h1>
        <p>Discover and play games from the LNBQSHA universe</p>
    </section>

    <section class="game-grid" id="gameGrid">
        <!-- Game cards will be populated by JavaScript -->
    </section>

    <script>
        const games = [
            { id: 'obstacle_rush', name: 'Obstacle Rush', icon: '🏃', desc: 'Run, dodge, and survive!', players: 234, tag: 'hot' },
            { id: 'block_battle', name: 'Block Battle', icon: '🧱', desc: 'Build and destroy!', players: 89, tag: 'new' },
            { id: 'coin_race', name: 'Coin Race', icon: '🪙', desc: 'Collect coins and race!', players: 567, tag: 'popular' },
            { id: 'puzzle_quest', name: 'Puzzle Quest', icon: '🧩', desc: 'Solve puzzles and unlock!', players: 45, tag: 'new' },
            { id: 'space_war', name: 'Space War', icon: '🚀', desc: 'Fight in space!', players: 123, tag: 'hot' },
            { id: 'dragon_fight', name: 'Dragon Fight', icon: '🐉', desc: 'Battle dragons!', players: 78, tag: 'popular' },
            { id: 'candy_crush', name: 'Candy Crush', icon: '🍬', desc: 'Match candies and win!', players: 345, tag: 'popular' },
            { id: 'tower_defense', name: 'Tower Defense', icon: '🏰', desc: 'Defend your tower!', players: 67, tag: 'new' },
        ];

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = games.map(game => `
                <div class="game-card" onclick="playGame('${game.id}')">
                    <div class="thumb">${game.icon}</div>
                    <div class="info">
                        <h3>${game.name} <span class="badge badge-${game.tag}">${game.tag}</span></h3>
                        <p>${game.desc}</p>
                        <div class="meta">
                            <span>👤 ${game.players}</span>
                            <span>🎮 ${Math.floor(Math.random() * 20) + 1} online</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function playGame(gameId) {
            alert(`🎮 Starting ${games.find(g => g.id === gameId)?.name || 'game'}!`);
        }

        renderGames();
    </script>
</body>
</html>
